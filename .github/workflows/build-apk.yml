name: Build Crew Gallery APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log || {
            # Errors as annotations, so they can be read without downloading the log.
            grep -E "^e: |error:|rror|What went wrong|Could not|^> [^T]|^  > " build.log | grep -v "^> Task" | head -10 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/CrewGallery-$VERSION.apk"
          echo "APK=CrewGallery-$VERSION.apk" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: CrewGallery-apk
          path: ${{ env.APK }}

      # A GitHub Release per version, so the APK downloads straight on the phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: crew-v${{ env.VERSION }}
          name: Crew Gallery ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ env.APK }}
